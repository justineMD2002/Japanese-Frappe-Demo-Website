{%- set org = company() %}
<section class="contact-band" aria-labelledby="contact-band-heading">
	<div class="container contact-band__inner">
		<div>
			<h2 class="contact-band__title" id="contact-band-heading">{{ _("Talk to us about your systems") }}</h2>
			<p>{{ _("Tell us what you use today and what you want to improve. We will reply by email.") }}</p>
		</div>
		<div class="contact-band__actions">
			<p class="contact-band__phone"><a href="tel:{{ org.phone_tel }}">{{ org.phone_display }}</a> <span class="contact-band__hours">{{ _("Weekdays 9:00 to 18:00 (Philippine time)") }}</span></p>
			<a class="button button--inverse" href="/contact">{{ _("Open the contact form") }}</a>
		</div>
	</div>
</section>
